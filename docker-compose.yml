services:
  app:
    build: .
    image: signup:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  queue:
    image: signup:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--max-time=3600"]
    stop_signal: SIGTERM
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: signup:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-signup}"
      MARIADB_USER: "${DB_USERNAME:-signup}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db:
  storage:
